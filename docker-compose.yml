services:
  web:
    image: ${IMAGE:-cme-personal-actionplanner:latest}
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    environment:
      - DJANGO_DEBUG=False
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - db_data:/app/data
      - media_data:/app/media
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy

  mcp:
    image: ${IMAGE:-cme-personal-actionplanner:latest}
    ports:
      - "8001:8001"
    env_file:
      - .env.prod
    environment:
      - DJANGO_DEBUG=False
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - db_data:/app/data
      - media_data:/app/media
    command: ["python", "-m", "mcp_server.server", "--transport", "sse", "--port", "8001"]
    restart: unless-stopped
    depends_on:
      - web

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Uncomment to enable GPU acceleration (requires nvidia-container-toolkit on host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  db_data:
  media_data:
  ollama_data:
