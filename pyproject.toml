[project]
name = "cme-personal-actionplanner"
version = "0.1.0"
description = "AI-powered personal todo and planner app"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "actionplanner.settings"
python_files = ["tests.py", "test_*.py"]
pythonpath = ["."]
addopts = "-p no:ament_copyright -p no:ament_flake8 -p no:ament_pep257 -p no:ament_lint -p no:ament_xmllint -p no:launch_testing -p no:launch_testing_ros"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "actionplanner.settings"
